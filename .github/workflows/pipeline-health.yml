name: Pipeline Health Check

# audit #1031: process-project 스케줄이 멈춰도 아무 경보가 없던 구조적 취약점 대응.
# 저장소가 GitHub 서버에서 매일 스스로 생존 여부를 점검하므로,
# 로컬 스케줄러가 죽어도 이 워크플로는 계속 돌아간다(단일 실패점 회피).

on:
  schedule:
    # 매일 00:30 UTC = 09:30 KST — 일 03:18 KST 스케줄이 도는지 아침에 확인
    - cron: '30 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check pipeline liveness
        id: check
        run: |
          set +e
          python3 scripts/check_pipeline_health.py | tee health.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Compose alert body
        if: steps.check.outputs.status != '0'
        run: |
          {
            echo "자동 생존 점검이 실패했습니다. process-project 스케줄 실행 상태를 확인하십시오."
            echo ""
            echo '```'
            cat health.txt
            echo '```'
            echo ""
            echo "- 점검 스크립트: scripts/check_pipeline_health.py"
            echo "- 관련: audit #1031, 주간 갭분석 2026-09-10 제4절"
            echo "- 점검 시각(UTC): $(date -u +%Y-%m-%dT%H:%MZ)"
          } > alert.md

      - name: Open or update alert issue
        if: steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          TITLE="[pipeline-health] 자동화 파이프라인 정지 의심"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file alert.md
            echo "기존 이슈 #${EXISTING}에 코멘트"
          else
            gh issue create --title "$TITLE" --label "maintenance" --body-file alert.md
            echo "신규 이슈 생성"
          fi

      - name: Fail job if unhealthy
        if: steps.check.outputs.status != '0'
        run: |
          echo "파이프라인 생존 점검 실패 — 위 이슈 참조"
          exit 1
