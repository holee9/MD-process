name: Validate Frontmatter

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'scripts/validate_frontmatter.py'
  pull_request: {}
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate
        run: python3 scripts/validate_frontmatter.py
